<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Document Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="docTitle">Loading Document...</h2>
        <a href="/" class="btn btn-secondary">Back to Workspace</a>
    </div>
    
    <div class="mb-2 text-muted" id="status">Connecting...</div>

    <div class="form-group">
        <textarea id="editor" class="form-control" rows="18" style="font-family: monospace; font-size: 1.1rem;"></textarea>
    </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
