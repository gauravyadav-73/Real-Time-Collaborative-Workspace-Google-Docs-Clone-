<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Collaborative Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">Collaborative Workspace</h1>
    
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Create New Document</h5>
            <div class="input-group mb-3">
                <input type="text" id="docTitle" class="form-control" placeholder="Document Title...">
                <button class="btn btn-primary" onclick="createNewDocument()">Create</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Existing Documents</h5>
            <ul id="documentList" class="list-group"></ul>
        </div>
    </div>
</div>

<script>
    async function loadDocuments() {
        const response = await fetch('/api/documents');
        const docs = await response.json();
        const list = document.getElementById('documentList');
        list.innerHTML = '';
        docs.forEach(doc => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <span><strong>${doc.title}</strong> (ID: ${doc.id})</span>
                <a href="/editor.html?id=${doc.id}" class="btn btn-sm btn-outline-success">Open Editor</a>
            `;
            list.appendChild(li);
        });
    }

    async function createNewDocument() {
        const title = document.getElementById('docTitle').value;
        if (!title) return alert("Enter document title");

        const response = await fetch('/api/documents', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title })
        });
        const doc = await response.json();
        window.location.href = `/editor.html?id=${doc.id}`;
    }

    loadDocuments();
</script>
</body>
</html>
